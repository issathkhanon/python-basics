[project]
name = "pythonbasics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Issath Khan", email = "issathkhan91@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.8.0",
    "beautifulsoup4==4.15.0",
    "blinker==1.9.0",
    "bs4==0.0.2",
    "certifi==2026.11.20",
    "charset-normalizer==3.5.3",
    "click==8.5.1",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "flask==3.1.3",
    "idna==3.20",
    "iniconfig==2.3.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "numpy==2.5.5",
    "packaging==26.4",
    "pluggy==1.7.0",
    "pydantic==2.14.4",
    "pydantic-core==2.50.5",
    "pygments==2.21.0",
    "pytest==9.2.0",
    "requests==2.34.2",
    "ruff>=0.17.6",
    "soupsieve==4.1.3",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "urllib3==2.8.0",
    "werkzeug==3.1.9",
]

[project.scripts]
pythonbasics = "pythonbasics:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"
